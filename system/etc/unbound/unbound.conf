include: "/etc/unbound/resolvconf.conf"

server:
  interface: 127.0.0.1
  interface: ::1
  access-control: 127.0.0.1 allow
  access-control: ::1 allow
  verbosity: 1

  # --- Performance ---
  num-threads: 2
  msg-cache-slabs: 2
  rrset-cache-slabs: 2
  infra-cache-slabs: 2
  key-cache-slabs: 2
  so-reuseport: yes
  msg-cache-size: 64m
  rrset-cache-size: 128m     # should be ~2x msg-cache-size
  key-cache-size: 16m
  neg-cache-size: 8m
  cache-max-ttl: 172800      # 2 days
  cache-min-ttl: 3600        # 1 hour
  prefetch: yes              # refresh popular records before they expire
  prefetch-key: yes          # prefetch DNSSEC keys too
  serve-expired: yes         # answer instantly from stale cache, refresh in background
  serve-expired-ttl: 86400   # serve stale data for at most 1 day
  serve-expired-client-timeout: 0
  aggressive-nsec: yes       # answer NXDOMAIN from cached DNSSEC proofs
  rrset-roundrobin: yes
  minimal-responses: yes

  # --- Privacy ---
  qname-minimisation: yes    # send only the needed label upstream
  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

  # --- Security / DNSSEC ---
  trust-anchor-file: "/etc/unbound/trusted-key.key"
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-algo-downgrade: yes
  harden-large-queries: yes
  harden-short-bufsize: yes
  use-caps-for-id: no        # DoT already protects against spoofing
  val-clean-additional: yes
  unwanted-reply-threshold: 10000000

  # --- DNS rebinding protection ---
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10

  private-domain: "intranet"
  private-domain: "internal"
  private-domain: "private"
  private-domain: "corp"
  private-domain: "home"
  private-domain: "lan"

  unblock-lan-zones: yes
  insecure-lan-zones: yes

  domain-insecure: "intranet"
  domain-insecure: "internal"
  domain-insecure: "private"
  domain-insecure: "corp"
  domain-insecure: "home"
  domain-insecure: "lan"

  local-zone: "10.in-addr.arpa." transparent

remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-port: 8953
  server-key-file: "/etc/unbound/unbound_server.key"
  server-cert-file: "/etc/unbound/unbound_server.pem"
  control-key-file: "/etc/unbound/unbound_control.key"
  control-cert-file: "/etc/unbound/unbound_control.pem"

# Local network names (*.lan, reverse lookups) go to the router
forward-zone:
  name: "lan."
  forward-addr: 192.168.1.1

forward-zone:
  name: "1.168.192.in-addr.arpa."
  forward-addr: 192.168.1.1

# Everything else: encrypted DNS-over-TLS
forward-zone:
  name: "."
  forward-tls-upstream: yes
  # Cloudflare (fast, no-logging policy)
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 1.0.0.1@853#cloudflare-dns.com
  forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
  forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com
  # Quad9 unfiltered (non-profit, Swiss privacy law, no ECS)
  forward-addr: 9.9.9.10@853#dns10.quad9.net
  forward-addr: 149.112.112.10@853#dns10.quad9.net
  forward-addr: 2620:fe::10@853#dns10.quad9.net
  forward-addr: 2620:fe::fe:10@853#dns10.quad9.net
