# BitTorrent / libtorrent network tuning

# TCP congestion control: BBR reduces queue buildup, better throughput on WiFi/lossy links
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Socket receive/send buffers: allow libtorrent to use up to 16MB per socket
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# TCP buffer auto-tuning range (min / default / max)
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# UDP receive buffer: critical for uTP (libtorrent's preferred transport)
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# Accept backlog: allow more pending inbound peer connections
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Faster SYN retries when connecting to peers
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3

# Allow more outgoing connections in parallel (ephemeral port range)
net.ipv4.ip_local_port_range = 1024 65535

# Reuse TIME_WAIT sockets faster for rapid peer reconnects
net.ipv4.tcp_tw_reuse = 1

# Increase max open files/connections
fs.file-max = 200000
