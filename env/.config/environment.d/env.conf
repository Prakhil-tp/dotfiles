# xdg environment variables
XDG_DATA_HOME="$HOME/.local/share"
XDG_CONFIG_HOME="$HOME/.config"
XDG_STATE_HOME="$HOME/.local/state"
XDG_CACHE_HOME="$HOME/.cache"

EDITOR="nvim"
BROWSER="qutebrowser"

# clipmenu
CM_SELECTIONS="clipboard"
CM_DEBUG=0
CM_OUTPUT_CLIP=1
CM_MAX_CLIPS=10

# dracula theme for fzf
# FZF_DEFAULT_OPTS="--color=fg:#f8f8f2,hl:#bd93f9 --color=fg+:#f8f8f2,hl+:#bd93f9 --color=info:#ffb86c,prompt:#50fa7b,pointer:#ff79c6 --color=marker:#ff79c6,spinner:#ffb86c,header:#6272a4 --layout=reverse --height 40%"

# catppuccine theme for fzf
FZF_DEFAULT_OPTS="--color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8 --color=fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc --color=marker:#f5e0dc,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8 --layout=reverse --height 40%"

# cleanup
ZDOTDIR="$XDG_CONFIG_HOME/zsh"
LESSHISTFILE="$XDG_CACHE_HOME/less/history"
ASDF_DIR="$XDG_DATA_HOME/asdf-lib"
ASDF_DATA_DIR="$XDG_DATA_HOME/asdf"
ASDF_CONFIG_FILE="$XDG_CONFIG_HOME/asdf/asdrc"
ASDF_DEFAULT_TOOL_VERSIONS_FILENAME="$XDG_CONFIG_HOME/asdf/tool-versions"
GTK2_RC_FILES="$XDG_CONFIG_HOME/gtk-2.0/gtkrc"
MBSYNCRC="$XDG_CONFIG_HOME/isync/mbsyncrc"
TERMINFO="$XDG_DATA_HOME/terminfo"
TERMINFO_DIRS="$XDG_DATA_HOME/terminfo:/usr/share/terminfo"
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/npmrc"
NODE_REPL_HISTORY="$XDG_DATA_HOME/node_repl_history"
PYTHONSTARTUP="$XDG_CONFIG_HOME/python/pythonrc"
HISTFILE="$XDG_CACHE_HOME/zsh/history"
CUDA_CACHE_PATH="$XDG_CACHE_HOME/nv"
GNUPGHOME="$XDG_DATA_HOME/gnupg"
PASSWORD_STORE_DIR="$XDG_DATA_HOME/pass"
ERRFILE="$XDG_CACHE_HOME/X11/xsession-errors"

# cargo/rustup
CARGO_HOME="$XDG_DATA_HOME/cargo"
RUSTUP_HOME="$XDG_DATA_HOME/rustup"

# bun
BUN_INSTALL="$XDG_DATA_HOME/bun"

# .NET
DOTNET_CLI_HOME="$XDG_DATA_HOME/dotnet"

# yarn
YARN_GLOBAL_FOLDER="$XDG_DATA_HOME/yarn"
YARN_CACHE_FOLDER="$XDG_CACHE_HOME/yarn"

# nuget
NUGET_PACKAGES="$XDG_DATA_HOME/NuGet/packages"
NUGET_HTTP_CACHE_PATH="$XDG_CACHE_HOME/NuGet"

# claude code config dir (sessions, projects, data)
CLAUDE_CONFIG_DIR="$XDG_DATA_HOME/claude"

# vim
VIMINFO_FILE="$XDG_STATE_HOME/vim/viminfo"
GRADLE_USER_HOME="$XDG_DATA_HOME/gradle"
PUB_CACHE="$XDG_DATA_HOME/pub-cache"
W3M_DIR="$XDG_STATE_HOME/w3m"
HERMES_HOME="$XDG_DATA_HOME/hermes"
