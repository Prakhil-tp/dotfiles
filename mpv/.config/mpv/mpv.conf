# ================================
# YouTube / yt-dlp integration
# ================================

ytdl-format=bestvideo[height<=?1080][fps<=?60][vcodec!=?vp9]+bestaudio/best
# ytdl-format=bestvideo[height<=?1080][fps<=?60][vcodec!=?vp9]+bestaudio/best/best

# ytdl-raw-options=cookies-from-browser=firefox
script-opts=ytdl_hook-ytdl_path=/usr/bin/yt-dlp

# ================================
# Hardware acceleration
# ================================

# Renoir/Barcelo APU has VA-API HEVC(Main/Main10) decode — use it.
# Software-decoding 1080p x265 here pegs the CPU and freezes the desktop.
hwdec=auto-safe

# ================================
# Video output
# ================================

vo=gpu
gpu-context=auto
# NOTE: profile=high-quality + ewa_lanczossharp scalers are too heavy for an
# integrated APU and were part of the freeze. Using mpv's light defaults.
# profile=high-quality
# scale=ewa_lanczossharp
# dscale=mitchell
# cscale=ewa_lanczossharp
# scale-antiring=0.7

# ================================
# Cache / Buffering
# ================================

cache=yes
cache-secs=120
cache-pause=no

# Larger demuxer buffers for streaming
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

# More aggressive prefetching helps underruns
demuxer-thread=yes
rebase-start-time=no

# ================================
# Audio
# ================================

# Helps with underrun issues
audio-buffer=4
autosync=30
ao=pipewire
audio-stream-silence=yes


# ================================
# Network
# ================================

network-timeout=30

# ================================
# Subtitles
# ================================

sub-file-paths=subs
slang=eng,en,und
sub-scale=1
