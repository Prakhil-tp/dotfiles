# vim:ft=kitty

include themes/current-theme.conf

env TERM=kitty

# --- Font ---
font_family JetBrainsMono NF ExtraLight
bold_font auto
italic_font auto
bold_italic_font auto

# Set font size
font_size 12.0

# Font adjustments
font_features none
# symbol_map U+E000-U+F8FF JetBrainsMono NF

# --- Window Padding ---
window_padding_width 2

# --- Window Opacity ---
background_opacity 0.96

# --- Shell Program ---
shell /usr/bin/zsh

# --- Scrolling ---
scrollback_lines 10000
scrollback_pager_history_size 0
scrollback_pager sh -c "less +G"

enable_audio_bell no

# -- animation
cursor_trail 1
cursor_trail_decay 0.05 0.12
cursor_trail_start_threshold 2

# disable confirm window
confirm_os_window_close 0
